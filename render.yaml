# Render "Blueprint" - lets Render configure the whole service from
# this file (New -> Blueprint -> pick this repo) instead of clicking
# through build/start command fields by hand. See Dockerfile for what
# actually gets built and run.
services:
  - type: web
    name: cricket-performance-analytics
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Public deployment: explore every dashboard, but uploading a
      # match or fixing a data-quality issue is disabled (see
      # backend/app/main.py). Remove this var (or set it to "false")
      # for a private deployment with full read/write access.
      - key: READ_ONLY
        value: "true"
      # Enables "Ask the Data" (backend/app/services/nl_to_sql.py) -
      # turns a plain-English question into a read-only SQL query via
      # Claude. `sync: false` means Render will NOT read a value from
      # this file (there isn't one here) - it prompts for the key in
      # the dashboard instead, so the actual secret is never committed.
      # Leave it unset to deploy without this feature; the app detects
      # that and reports it as unavailable rather than failing.
      - key: ANTHROPIC_API_KEY
        sync: false
